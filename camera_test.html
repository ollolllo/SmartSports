<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄像头检测</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .info-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .info-box h3 {
            margin-top: 0;
            color: #333;
        }
        .info-item {
            margin: 10px 0;
            padding: 8px;
            background: #fff;
            border-radius: 4px;
        }
        .label {
            font-weight: bold;
            color: #666;
        }
        .value {
            color: #000;
            margin-left: 10px;
        }
        #cameraList {
            margin: 20px 0;
        }
        #videoPreview {
            width: 100%;
            max-width: 640px;
            background: #000;
            border-radius: 8px;
        }
        .warning {
            color: #e67e22;
            background: #fef9e7;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .ok {
            color: #27ae60;
            background: #e8f8f5;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>📷 USB摄像头检测</h1>

    <div style="font-size: 14px;color: red;">
    <h3>标准参考:</h3>
    <ul style="margin: 5px 0;">
        <li>FOV ≥ 120° → ✅ 支持4人游戏</li>
        <li>FOV 80-120° → ⚠️ 支持2-3人</li>
        <li>FOV 小于 80° → ❌ 只支持1-2人</li>
    </ul>
    <span style="font-size: 12px;">视野角度(FOV) 最重要的参数！; 分辨率 1920x1080+ 最佳; 帧率 30fps+ 流畅</span>
    </div>
    
    <div id="cameraList">
        <h3>检测到的摄像头：</h3>
        <div class="info-box" id="cameraInfo">正在检测...</div>
    </div>

    <h3>实时预览：</h3>
    <video id="videoPreview" autoplay playsinline></video>

    <div id="analysis"></div>
 
 

    <script>
        async function getCameraInfo() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');

                const cameraInfoDiv = document.getElementById('cameraInfo');
                cameraInfoDiv.innerHTML = '';

                if (videoDevices.length === 0) {
                    cameraInfoDiv.innerHTML = '<p>未检测到摄像头</p>';
                    return;
                }

                videoDevices.forEach((device, index) => {
                    const div = document.createElement('div');
                    div.className = 'info-item';
                    div.innerHTML = `
                        <div class="label">摄像头 ${index + 1}:</div>
                        <div class="value">${device.label || '未命名摄像头'}</div>
                        <div class="label">设备ID:</div>
                        <div class="value" style="font-size: 10px; word-break: break-all;">${device.deviceId}</div>
                    `;
                    cameraInfoDiv.appendChild(div);
                });

                // 尝试获取最高分辨率
                try {
                    const constraints = {
                        video: {
                            width: { ideal: 3840 },
                            height: { ideal: 2160 }
                        }
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    const track = stream.getVideoTracks()[0];

                    const settings = track.getSettings();
                    const capabilities = track.getCapabilities ? track.getCapabilities() : {};

                    const analysisDiv = document.getElementById('analysis');
                    analysisDiv.innerHTML = `
                        <div class="info-box">
                            <h3>摄像头参数分析</h3>
                            <div class="info-item">
                                <div class="label">当前分辨率:</div>
                                <div class="value">${settings.width} x ${settings.height}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">宽高比:</div>
                                <div class="value">${(settings.width / settings.height).toFixed(2)}</div>
                            </div>
                            <div class="info-item">
                                <div class="label">帧率:</div>
                                <div class="value">${settings.frameRate ? settings.frameRate.toFixed(0) + ' fps' : '未知'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label"> facingMode:</div>
                                <div class="value">${settings.facingMode || '未指定'}</div>
                            </div>
                            ${capabilities.fov ? `
                            <div class="info-item">
                                <div class="label">视野角度(FOV):</div>
                                <div class="value">${capabilities.fov.min}° - ${capabilities.fov.max}°</div>
                            </div>
                            ` : '<div class="info-item"><div class="label">视野角度(FOV):</div><div class="value">浏览器不支持获取FOV信息</div></div>'}
                        </div>
                    `;

                    // 显示预览
                    const video = document.getElementById('videoPreview');
                    video.srcObject = stream;

                    // 估算可视范围
                    const horizontalFov = capabilities.fov ? capabilities.fov.max : 60; // 默认60度
                    const width = settings.width;
                    const height = settings.height;

                    let recommendation = '';
                    if (horizontalFov >= 120) {
                        recommendation = `<div class="ok">✅ 广角摄像头(FOV ${horizontalFov}°)，适合4人游戏</div>`;
                    } else if (horizontalFov >= 80) {
                        recommendation = `<div class="warning">⚠️ 中等视角(FOV ${horizontalFov}°)，建议最多2-3人</div>`;
                    } else {
                        recommendation = `<div class="warning">⚠️ 窄视角(FOV ${horizontalFov}°)摄像头，建议最多1-2人</div>`;
                    }

                    const playerRecommendation = `
                        <div class="info-box">
                            <h3>4人游戏可行性分析</h3>
                            ${recommendation}
                            <div class="info-item">
                                <div class="label">分辨率分析:</div>
                                <div class="value">${width >= 1920 ? '高清(1920+) - 可满足4人检测' : '分辨率较低 - 可能影响多人检测'}</div>
                            </div>
                        </div>
                    `;
                    analysisDiv.innerHTML += playerRecommendation;

                } catch (err) {
                    console.error('获取摄像头参数失败:', err);
                    cameraInfoDiv.innerHTML += '<p>无法获取详细参数: ' + err.message + '</p>';
                }

            } catch (err) {
                console.error('枚举设备失败:', err);
                document.getElementById('cameraInfo').innerHTML = '<p>检测失败: ' + err.message + '</p>';
            }
        }

        getCameraInfo();
    </script>


</body>
</html>
