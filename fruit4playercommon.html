    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        /* 使用dvh单位确保在移动端浏览器工具栏显示时也能完整显示 */
        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: portrait) {
            .game-container {
                min-height: 400px;
            }
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            overflow: hidden;
        }
        
        /* 使用dvh单位确保在移动端浏览器工具栏显示时也能完整显示 */
        @supports (height: 100dvh) {
            .game-container {
                height: 100dvh;
            }
        }
        
        .game-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(16px, 3vw, 24px);
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 20;
            margin: 0;
            white-space: nowrap;
        }
        
        /* 玩家区域容器 - 全屏横向排列 */
        .players-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }
        
        .player-area {
            position: relative;
            flex: 1;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
        }
        
        .player-title {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 10px;
            border-radius: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-avatar {
            width: 25%;
            padding-bottom: 25%;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-width: 80px;
            min-height: 80px;
            margin-bottom: 5px;
        }

        .player-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 24px;
            margin-bottom: 10px;
            min-height: 30px;
        }

        .player-name {
            font-weight: bold;
            color: #333;
        }

        /* 确保player-score样式优先级 */
        .player-info .player-score {
            font-weight: bold;
            color: red !important;
            font-family: 'Microsoft YaHei', sans-serif !important;
            font-size: 24px !important;
        }

        /* 确保score-display样式优先级 */
        .player-info #score-display-1,
        .player-info #score-display-2,
        .player-info #score-display-3,
        .player-info #score-display-4 {
            font-weight: bold;
            color: red !important;
            font-family: 'Microsoft YaHei', sans-serif !important;
            font-size: 24px !important;
        }

        .score-display {
            font-size: 24px;
            font-weight: bold;
            color: red;
            white-space: nowrap;
            text-align: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .score-change {
            animation: score-animation 0.5s ease-out;
        }

        @keyframes score-animation {
            0% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translateX(-50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .action-display {
            font-size: 12px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 8px;
            border-radius: 8px;
            z-index: 20;
            white-space: nowrap;
            text-align: center;
            margin-bottom: 10px;
        }

        /* 游戏开始时隐藏action-display */
        .player-area.game-running .action-display {
            display: none;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            overflow: hidden;
        }

        /* 游戏倒计时显示 */
        .game-timer {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95) 0%, rgba(118, 75, 162, 0.95) 100%);
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-content {
            text-align: center;
            color: white;
        }

        .timer-label {
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .timer-value {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .fruit-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .character {
            position: relative;
            width: 40%;
            height: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            z-index: 10;
        }

        .object {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 5;
        }

 
        .弹幕 {
            position: absolute;
            font-size: 2vw;
            font-weight: bold;
            color: #ff4500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
            animation: float-up 2s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        .start-button {
            position: absolute;
            top: 50px;
            left: 20px;
            height: 36px;
            padding: 0 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            line-height: 36px;
        }

        .camera-container {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 400px;
            height: 220px;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            z-index: 20;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #pose-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .action-display {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
        }

        .start-button:hover {
            background: #45a049;
        }

 
 

        /* 确保在所有屏幕尺寸上都能正常显示 */
        @media (max-width: 1920px) {
            .start-button {
                font-size: 16px;
                padding: 0 16px;
            }
        }

        @media (max-width: 768px) {
            .start-button {
                font-size: 14px;
                padding: 0 12px;
            }
            
 
            
            .game-title {
                font-size: 4vw;
            }
            
            .action-display {
                font-size: 14px;
                padding: 6px 12px;
            }
            
            .camera-container {
                width: 20vw;
                height: 15vw;
            }
            
            .players-container {
                padding: 60px 10px 10px 10px;
                gap: 10px;
            }
            
            .character {
                width: 40%;
                height: 40%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
 
            
            .弹幕 {
                font-size: 3vw;
            }
        }

        @media (max-width: 480px) {
            .start-button {
                font-size: 12px;
                padding: 0 10px;
                height: 36px;
                line-height: 36px;
            }
 
            
            .game-title {
                font-size: 5vw;
                top: 3%;
            }
            
            .action-display {
                font-size: 12px;
                padding: 4px 10px;
                top: 3%;
            }
            
            .camera-container {
                width: 25vw;
                height: 18.75vw;
                top: 3%;
            }
            
            .players-container {
                padding: 50px 5px 5px 5px;
                gap: 5px;
            }
            
            .player-title {
                font-size: 10px;
                padding: 1px 5px;
            }
            
            .character {
                width: 40%;
                height: 40%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
 

            .弹幕 {
                font-size: 4vw;
            }
        }
    </style>
</head>
<body>

        <!-- 游戏倒计时显示 -->

        <button style="display:none;" class="start-button" id="start-button">开始游戏</button>

    <script>
        // 游戏状态
        let gameRunning = false;
        let players = [];
        let currentAction = "";
        let isUsingMockData = false;

        // 游戏倒计时设置
        let GAME_DURATION = 60; // 默认60秒，可设置
        let gameTimer = null; // 倒计时定时器
        let gameTimeLeft = GAME_DURATION; // 剩余时间

        // 重新开始倒计时设置
        let RESTART_COUNTDOWN = 5;
        let restartTimer = null;
        let restartTimeLeft = RESTART_COUNTDOWN;

        // 跳跃判断方式开关：true 为基于上半身，false 为基于下半身（默认）
        let useUpperBodyJumpDetection = true;
        
        // 共用滑动图片状态
        // let sharedSlidingImage = null;
        // let isSlidingImageVisible = false;
        // let isSlidingPaused = false;
        // let isObjectsPaused = false;
        // let isJumpDisabled = false;
        // let isInProximity = false;
        
        // 游戏参数
        const startButton = document.getElementById('start-button');
        const gameContainer = document.querySelector('.game-container');
        
        // 玩家数据结构
        function createPlayer(id) {
            return {
                id: id,
                gameArea: document.getElementById(`game-area-${id}`),
                character: document.getElementById(`character-${id}`),
                // expressionImage: document.getElementById(`expression-image-${id}`),
                objects: [],
                fruits: [],
                particles: [],
                rightBladeTrail: [],
                leftBladeTrail: [],
                lastRightHandPosition: null,
                lastLeftHandPosition: null,
                lastRightHandTime: 0,
                lastLeftHandTime: 0,
                combo: 0,
                comboTimer: null,
                lastSpawnTime: 0,
                spawnInterval: 900,
                currentAction: "举起右手开始",
                gameRunning: false,
                score: 0,
                currentRightHandUp: false,
                avatar: '',
                isCollisionExpression: false
            };
        }

        // 水果忍者游戏参数
        const FRUIT_TYPES = [
            { name: 'apple', emoji: '🍎', color: '#ff4444', points: 10, size: 45 },
            { name: 'orange', emoji: '🍊', color: '#ff8800', points: 10, size: 45 },
            { name: 'watermelon', emoji: '🍉', color: '#44ff44', points: 15, size: 45 },
            { name: 'grape', emoji: '🍇', color: '#8844ff', points: 20, size: 45 },
            { name: 'banana', emoji: '🍌', color: '#ffff44', points: 10, size: 45 },
            { name: 'strawberry', emoji: '🍓', color: '#ff4466', points: 15, size: 45 },
            { name: 'pineapple', emoji: '🍍', color: '#ffff00', points: 25, size: 45 }
        ];

        const FRUIT_AREA_WIDTH = 160;
        const FRUIT_AREA_LEFT = 0;
        const FRUIT_AREA_RIGHT = 160;
        const SLICE_ZONE_TOP = 0;
        const SLICE_ZONE_BOTTOM = Infinity;
        const ACTION_COOLDOWN = 300;

        let currentTwoHandsUp = false;
        let lastTwoHandsTime = 0;
        let difficulty = 1;

        class BladePoint {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.time = Date.now();
            }
        }

        class Fruit {
            constructor(canvasWidth) {
                this.canvasWidth = canvasWidth || 300;
                this.type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
                this.x = Math.random() * (this.canvasWidth - this.type.size);
                this.y = -this.type.size;
                this.vy = 2 + Math.random() * 2 * difficulty;
                this.vx = (Math.random() - 0.5) * 2;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.sliced = false;
                this.sliceAngle = 0;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.rotation += this.rotationSpeed;

                if (this.x < 0) this.x = 0;
                if (this.x > this.canvasWidth - this.type.size) this.x = this.canvasWidth - this.type.size;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.type.size / 2, this.y + this.type.size / 2);
                ctx.rotate(this.rotation);

                ctx.font = `${this.type.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type.emoji, 0, 0);

                ctx.restore();

                if (this.sliced) {
                    ctx.save();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(this.x - 20, this.y - 20);
                    ctx.lineTo(this.x + 20, this.y + 20);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            containsPoint(x, y) {
                const centerX = this.x + this.type.size / 2;
                const centerY = this.y + this.type.size / 2;
                const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                return distance < this.type.size / 2 + 20;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15 - 5;
                this.color = color;
                this.life = 1;
                this.decay = 0.02 + Math.random() * 0.02;
                this.size = 5 + Math.random() * 10;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size * this.life), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawLightningBolt(ctx, x1, y1, x2, y2, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.restore();
        }

        function spawnFruitForPlayer(player) {
            const now = Date.now();
            if (now - player.lastSpawnTime > player.spawnInterval) {
                const canvas = document.getElementById(`fruit-canvas-${player.id}`);
                const canvasWidth = canvas ? canvas.width : 300;
                player.fruits.push(new Fruit(canvasWidth));
                player.lastSpawnTime = now;

                if (Math.random() < 0.1 * difficulty) {
                    setTimeout(() => {
                        if (player.gameRunning) player.fruits.push(new Fruit(canvasWidth));
                    }, player.spawnInterval / 3);
                }
            }
        }

        function sliceFruitForPlayer(player, handX, handY) {
            const gameX = handX;
            const gameY = handY;

            if (gameY < SLICE_ZONE_TOP || gameY > SLICE_ZONE_BOTTOM) {
                return false;
            }

            for (let i = player.fruits.length - 1; i >= 0; i--) {
                const fruit = player.fruits[i];
                if (!fruit.sliced && fruit.containsPoint(gameX, gameY)) {
                    fruit.sliced = true;

                    const fruitCenterX = fruit.x + fruit.type.size / 2;
                    const fruitCenterY = fruit.y + fruit.type.size / 2;

                    const canvas = document.getElementById(`fruit-canvas-${player.id}`);
                    const ctx = canvas ? canvas.getContext('2d') : null;
                    if (ctx) {
                        drawLightningBolt(ctx, gameX, gameY, fruitCenterX, fruitCenterY, '#00ffff');
                    }

                    const points = currentTwoHandsUp ? fruit.type.points * 2 : fruit.type.points;
                    player.score += points;
                    player.combo++;

                    updateFruitScoreDisplay(player.id);

                    for (let j = 0; j < 15; j++) {
                        player.particles.push(new Particle(
                            fruit.x + fruit.type.size / 2,
                            fruit.y + fruit.type.size / 2,
                            fruit.type.color
                        ));
                    }

                    player.fruits.splice(i, 1);
                    return true;
                }
            }
            return false;
        }

        function updateFruitScoreDisplay(playerId) {
            const player = players.find(p => p.id === playerId);
            if (player) {
                const scoreDisplay = document.getElementById(`score-display-${playerId}`);
                if (scoreDisplay) {
                    scoreDisplay.textContent = `积分: ${player.score}`;
                }
            }
        }

 
        function checkMissedFruitForPlayer(player) {
            const canvas = document.getElementById(`fruit-canvas-${player.id}`);
            if (!canvas) return;
            
            const canvasHeight = canvas.height;
            for (let i = player.fruits.length - 1; i >= 0; i--) {
                if (player.fruits[i].y > canvasHeight) {  // 使用画布实际高度
                    player.fruits.splice(i, 1);
                }
            }
        }

       
        
        // 初始化游戏
        function initGame() {
            // 创建4个玩家
            for (let i = 1; i <= 4; i++) {
                players.push(createPlayer(i));

        // 模拟动作数据

        // 使用 QuickGameStarter 快速启动
        let gameStarter = null;
        let gameFramework = null;

        // 初始化游戏框架
        async function initGameFramework() {
            console.log('=== initGameFramework 开始 ===');
            try {
                gameStarter = new QuickGameStarter({
                    // GameFramework 配置
                    gameFrameworkOptions: {
                        playerCount: 4,
                        selfieMode: true,
                        videoElementId: 'camera',
                        poseCanvasId: 'pose-canvas',
                        modelComplexity: 1,
                        poseDetectInterval: 50, // 50毫秒 ,约 20fps
                        poseInputScale: 0.5, // 姿态检测输入缩放比例，0.5 表示宽高减半
                        minDetectionConfidence: 0.5,
                        minTrackingConfidence: 0.5,
                        useUpperBodyJumpDetection: true,
                        actionCooldown: 300,
                        detectionAreaTop: 0.45,
                        detectionAreaBottom: 0.85,
                        //只判断右手和站立动作
                        actionTypes: [ACTION_TYPE.RIGHT_HAND_RAISED, ACTION_TYPE.STANDING],
                        // 头像截取半径占视频最小边的比例（0~0.5，默认0.2）
                        // 以鼻子和双眼的平均位置为中心截取头像
                        avatarRadiusRatio: 0.1,
                        // 自定义玩家检测区域配置（可选）
                        // 如果注释掉这一行，就会根据 playerCount 水平平分画布
                        playerDetectionConfigs: [
                            { id: 1, detectionArea: { x1: 0.0, y1: 0.45, x2: 0.25, y2: 0.85 } },
                            { id: 2, detectionArea: { x1: 0.25, y1: 0.45, x2: 0.5, y2: 0.85 } },
                            { id: 3, detectionArea: { x1: 0.5, y1: 0.45, x2: 0.75, y2: 0.85 } },
                            { id: 4, detectionArea: { x1: 0.75, y1: 0.45, x2: 1.0, y2: 0.85 } }
                        ]
                    },

                    // 初始化完成回调
                    onInitialized: (data, framework) => {
                        console.log('游戏初始化完成:', data);
                    },

                    // 框架启动回调
                    onStarted: () => {
                        console.log('游戏框架开始运行');
                    },

                    // 玩家动作回调
                    onPlayerAction: (playerId, action, landmarks, framework) => {
                        handlePlayerAction(playerId, action, landmarks);
                    },

                    // 姿态结果回调
                    onPoseResults: (results, framework) => {
                        results.forEach(result => {
                            updatePlayerPose(result.playerId, result.landmarks);
                            updateHandPositions(result.playerId, result.landmarks);
                        });
                    },

                    // 动作结果回调
                    onActionResults: (results, framework) => {
                        results.forEach(result => {
                            updateActionDisplay(result.playerId, result.action);
                        });
                    },

                    // 摄像头就绪回调
                    onCameraReady: (framework) => {
                        startGameTimer();
                    },

                    // 错误回调
                    onError: (error) => {
                        console.error('游戏框架错误:', error);
                        document.getElementById('action-display').textContent = 
                            '摄像头访问失败: ' + error.message + '，使用模拟数据';
                        startMockActionData();
                    }
                });

                // 启动框架并传入游戏主循环
                gameFramework = await gameStarter.start(gameLoop);
                console.log('=== initGameFramework 完成 ===');

            } catch (error) {
                console.error('游戏框架启动失败:', error);
                console.log('错误堆栈:', error.stack);
                startMockActionData();
            }
        }

        // 处理玩家动作
        function isRankingInteractionLocked() {
            const rankingContainer = document.getElementById('game-rankings');
            if (!rankingContainer) return false;

            const lockedUntil = Number(rankingContainer.dataset.lockedUntil || 0);
            return Date.now() < lockedUntil;
        }

        function handlePlayerAction(playerId, action, landmarks) {
            if (isRankingInteractionLocked()) {
                return;
            }

            const player = players.find(p => p.id === playerId);
            if (!player) return;

            player.currentAction = action;

            // 更新动作显示
            const actionDisplay = document.getElementById(`action-display-${playerId}`);
            if (actionDisplay) {
                // 如果游戏未运行，显示"举起右手开始"
                if (!player.gameRunning) {
                    actionDisplay.textContent = "举起右手开始";
                } else {
                    // 游戏运行中，显示实际动作
                    actionDisplay.textContent = action;
                }
            }

            // 计算手腕位置（用于切水果）
            updateHandPositions(playerId, landmarks);

            // 游戏开始判断：如果玩家举起右手且游戏未运行，则启动该玩家的游戏
            if (action === ACTION_TYPE.RIGHT_HAND_RAISED && !player.gameRunning) {
                const closeBtn = document.getElementById('close-ranking');
                if (closeBtn) {
                    stopRestartCountdown();
                    closeBtn.click();
                    // 关闭弹窗后仍然要启动游戏，不return
                }
                togglePlayerGame(playerId);
            }

            // 检测是否举起双手（用于双倍积分）
            if (action === ACTION_TYPE.BOTH_HANDS_RAISED) {
                currentTwoHandsUp = true;
                lastTwoHandsTime = Date.now();
            } else {
                if (Date.now() - lastTwoHandsTime > 500) {
                    currentTwoHandsUp = false;
                }
            }
        }

        // 更新玩家姿态数据
        function updatePlayerPose(playerId, landmarks) {
            const player = players.find(p => p.id === playerId);
            if (!player || !landmarks) return;

            player.currentPose = landmarks;
        }

        // 更新手位置（与 fruit4player.html 一致的坐标转换）
        function updateHandPositions(playerId, landmarks) {
            const player = players.find(p => p.id === playerId);
            if (!player || !landmarks) return;

            const selfieMode = gameFramework.options.selfieMode;
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];

            // 获取玩家的检测区域配置（与视频画布中的矩形框对应）
            const playerConfig = gameFramework.playerConfigs.find(c => c.id === playerId);
            const detectionArea = playerConfig ? playerConfig.detectionArea : { x1: 0, y1: 0, x2: 1, y2: 1 };

            // 在自拍模式下，视频是镜像的，所以：
            // - 用户看到的"右手"对应 LEFT_WRIST（因为视频镜像了左右）
            // - 用户看到的"左手"对应 RIGHT_WRIST（因为视频镜像了左右）
            const rightWristToUse = selfieMode ? leftWrist : rightWrist;
            const leftWristToUse = selfieMode ? rightWrist : leftWrist;

            if (rightWristToUse && rightShoulder) {
                const gameArea = player.gameArea;
                if (gameArea) {
                    const gameRect = gameArea.getBoundingClientRect();
                    
                    // 将手腕坐标从视频画面坐标转换到检测区域坐标（与 fruit4player.html 一致）
                    // 注意：已经通过交换左右手处理了镜像，不需要再对X坐标进行镜像翻转
                    const relativeX = (rightWristToUse.x - detectionArea.x1) / (detectionArea.x2 - detectionArea.x1);
                    const relativeY = (rightWristToUse.y - detectionArea.y1) / (detectionArea.y2 - detectionArea.y1);

                    player.currentRightHandPosition = {
                        x: relativeX * gameRect.width,
                        y: relativeY * gameRect.height
                    };

                    const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
                    const armRaisedThreshold = Math.max(0.1, shoulderWidth * 0.3);
                    player.currentRightHandUp = rightShoulder.y - rightWristToUse.y > armRaisedThreshold;
                }
            } else {
                player.currentRightHandPosition = null;
                player.currentRightHandUp = false;
            }

            if (leftWristToUse && leftShoulder) {
                const gameArea = player.gameArea;
                if (gameArea) {
                    const gameRect = gameArea.getBoundingClientRect();
                    
                    // 同样的坐标转换
                    const relativeX = (leftWristToUse.x - detectionArea.x1) / (detectionArea.x2 - detectionArea.x1);
                    const relativeY = (leftWristToUse.y - detectionArea.y1) / (detectionArea.y2 - detectionArea.y1);

                    player.currentLeftHandPosition = {
                        x: relativeX * gameRect.width,
                        y: relativeY * gameRect.height
                    };
                }
            } else {
                player.currentLeftHandPosition = null;
            }
        }

        // 更新动作显示
        function updateActionDisplay(playerId, action) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            const actionDisplay = document.getElementById(`action-display-${playerId}`);
            if (actionDisplay) {
                if (!player.gameRunning) {
                    actionDisplay.textContent = "举起右手开始";
                } else {
                    actionDisplay.textContent = action;
                }
            }
        }

        // 切换游戏状态
        function toggleGame() {
            gameRunning = !gameRunning;
            
            if (gameRunning) {
                startButton.textContent = "停止游戏";
                startButton.style.background = "#f44336";
                // 开始所有玩家的游戏
                players.forEach(player => {
                    if (!player.gameRunning) {
                        togglePlayerGame(player.id);
                    }
                });
            } else {
                startButton.textContent = "开始游戏";
                startButton.style.background = "#4CAF50";
                // 停止所有玩家的游戏
                players.forEach(player => {
                    if (player.gameRunning) {
                        togglePlayerGame(player.id);
                    }
                });
                // 显示游戏排名
                showGameRankings();
            }
        }
        
        function togglePlayerGame(playerIndex) {
            const player = players.find(p => p.id === playerIndex);
            if (!player) return;
            
            // 获取玩家区域元素
            const playerArea = document.querySelector(`.player-area:nth-child(${playerIndex})`);
            
            player.gameRunning = !player.gameRunning;
            
            if (player.gameRunning) {
                // 开始该玩家的游戏
                player.objects = [];
                // 清零积分
                player.score = 0;
                // 更新积分显示
                const scoreDisplay = document.getElementById(`score-display-${player.id}`);
                if (scoreDisplay) {
                    scoreDisplay.textContent = `积分: ${player.score}`;
                }
 
                
                // 添加game-running类
                if (playerArea) {
                    playerArea.classList.add('game-running');
                }
                
                // 拍摄玩家头像
                capturePlayerAvatar(playerIndex);
            } else {
                // 停止该玩家的游戏
                player.objects.forEach(obj => {
                    if (obj.element && obj.element.parentNode) {
                        player.gameArea.removeChild(obj.element);
                    }
                });
                player.objects = [];
                
                // 移除game-running类
                if (playerArea) {
                    playerArea.classList.remove('game-running');
                }
            }
        }
        
        // 开始游戏
        function startGame() {
            players.forEach(player => {
                player.objects = [];
            });
            
            gameLoop();
            
        }
        
        // 停止游戏
        function stopGame() {
            // 停止游戏倒计时
            stopGameTimer();

            players.forEach(player => {
                player.objects.forEach(obj => {
                    if (obj.element && player.gameArea) {
                        player.gameArea.removeChild(obj.element);
                    }
                });
                player.objects = [];
            });

            // 显示游戏结束排名

        // 重新开始游戏（从排名浮窗触发）
        function restartGameFromRanking() {

            stopRestartCountdown();

 
            // 移除排名浮窗

        // 停止重新开始倒计时
        function stopRestartCountdown() {
            if (restartTimer) {
                clearInterval(restartTimer);
                restartTimer = null;
            }
        }

        // 检测是否有玩家举起右手
        function checkAnyPlayerRightHandUp() {
            for (let i = 0; i < players.length; i++) {
                if (players[i].currentRightHandUp) {
                    return true;
                }
            }
            return false;
        }



        // 启动游戏倒计时
        function startGameTimer() {
            const timerElement = document.getElementById('game-timer');
            const timerValue = document.getElementById('timer-value');

            if (timerElement) {
                timerElement.style.display = 'flex';
            }

            gameTimeLeft = GAME_DURATION;
            timerValue.textContent = gameTimeLeft;

            gameTimer = setInterval(() => {
                gameTimeLeft--;
                timerValue.textContent = gameTimeLeft;

                // 当时间少于等于10秒时，更醒目的颜色
                if (gameTimeLeft <= 10) {
                    timerValue.style.color = '#ff4444';
                    timerValue.style.textShadow = '2px 2px 4px rgba(255, 0, 0, 0.5)';
                }

                // 在倒计时过程中检查是否有玩家开始游戏
                const anyPlayerStarted = players.some(p => p.gameRunning);
                if (!anyPlayerStarted && (GAME_DURATION - gameTimeLeft) >= 8) {
                    // 8秒内没有玩家开始游戏，返回列表页
                    stopGameTimer();
                    window.location.href = '/smartgames.html';
                    return;
                }

                if (gameTimeLeft <= 0) {
                    endGameByTimer();
                }
            }, 1000);
        }

        // 停止游戏倒计时
        function stopGameTimer() {
            if (gameTimer) {
                clearInterval(gameTimer);
                gameTimer = null;
            }

            const timerElement = document.getElementById('game-timer');
            if (timerElement) {
                timerElement.style.display = 'none';
            }
        }

        // 倒计时结束，结束游戏
        function endGameByTimer() {
            stopGameTimer();

            // 停止所有玩家的游戏
            players.forEach(player => {
                player.gameRunning = false;
                // 停止水果生成
                if (player.fruits) {
                    player.fruits = [];
                }
            });

            // 显示游戏排名
            showGameRankings();
        }

        // 游戏主循环
        function gameLoop() {
            players.forEach(player => {
                const canvas = document.getElementById(`fruit-canvas-${player.id}`);
                if (!canvas) return;
                canvas.width = player.gameArea.offsetWidth;
                canvas.height = player.gameArea.offsetHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (player.gameRunning) {
                    // 游戏运行中，显示水果游戏
                    ctx.fillStyle = "#0a0a1a";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    spawnFruitForPlayer(player);

                    for (let i = player.fruits.length - 1; i >= 0; i--) {
                        player.fruits[i].update();
                        player.fruits[i].draw(ctx);
                    }

                    for (let i = player.particles.length - 1; i >= 0; i--) {
                        player.particles[i].update();
                        player.particles[i].draw(ctx);
                        if (player.particles[i].life <= 0) {
                            player.particles.splice(i, 1);
                        }
                    }

                    // 绘制挥刀轨迹
                    drawBladeTrail(player, ctx);

                    checkMissedFruitForPlayer(player);
                    checkHandSliceForPlayer(player);
                } else {
                    // 游戏未开始，显示对应检测区域的视频画面
                    drawPlayerDetectionAreaVideo(player, ctx);
                }
            });

            requestAnimationFrame(gameLoop);
        }

        // 绘制玩家检测区域对应的视频画面
        function drawPlayerDetectionAreaVideo(player, ctx) {
            const video = document.getElementById('camera');
            if (!video || !video.videoWidth || !video.videoHeight) {
                // 如果视频未就绪，显示等待提示
                ctx.fillStyle = "#1a1a2e";
                ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "14px Arial";
                ctx.textAlign = "center";
                ctx.fillText("等待摄像头...", ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            // 获取玩家的检测区域配置
            const playerConfig = gameFramework ? gameFramework.playerConfigs.find(c => c.id === player.id) : null;
            let detectionArea = playerConfig ? playerConfig.detectionArea : { x1: 0, y1: 0, x2: 1, y2: 1 };

            // 计算视频源区域（考虑自拍模式的镜像）
            const selfieMode = gameFramework ? gameFramework.options.selfieMode : true;
            
            // 如果是自拍模式，需要镜像玩家检测区域（因为视频是左右镜像的）
            // 原来的顺序 1,2,3,4 变成 4,3,2,1
            let finalDetectionArea = detectionArea;
            if (selfieMode) {
                // 镜像x坐标：x1' = 1 - x2, x2' = 1 - x1
                finalDetectionArea = {
                    x1: 1 - detectionArea.x2,
                    y1: detectionArea.y1,
                    x2: 1 - detectionArea.x1,
                    y2: detectionArea.y2
                };
            }

            let sourceX = finalDetectionArea.x1 * video.videoWidth;
            let sourceY = finalDetectionArea.y1 * video.videoHeight;
            let sourceWidth = (finalDetectionArea.x2 - finalDetectionArea.x1) * video.videoWidth;
            let sourceHeight = (finalDetectionArea.y2 - finalDetectionArea.y1) * video.videoHeight;

            // 如果是自拍模式，镜像视频
            ctx.save();
            if (selfieMode) {
                ctx.translate(ctx.canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // 绘制视频区域
            try {
                ctx.drawImage(
                    video,
                    sourceX, sourceY, sourceWidth, sourceHeight,
                    0, 0, ctx.canvas.width, ctx.canvas.height
                );
            } catch (e) {
                console.log('视频绘制暂不可用');
            }

            ctx.restore();

            // 绘制边框提示
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 3;
            ctx.strokeRect(5, 5, ctx.canvas.width - 10, ctx.canvas.height - 10);

            // 绘制玩家提示文字
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(10, 10, ctx.canvas.width - 20, 30);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px Arial";
            ctx.textAlign = "center";
            ctx.fillText(`玩家${player.id} - 举起右手开始`, ctx.canvas.width / 2, 30);
        }

        function checkHandSliceForPlayer(player) {
            if (!player.gameRunning) return;

            const now = Date.now();

            if (player.currentRightHandPosition) {
                const handX = player.currentRightHandPosition.x;
                const handY = player.currentRightHandPosition.y;

                if (player.lastRightHandPosition) {
                    const dx = handX - player.lastRightHandPosition.x;
                    const dy = handY - player.lastRightHandPosition.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > 10) {
                        player.rightBladeTrail.push(new BladePoint(handX, handY));
                    }

                    const dt = now - player.lastRightHandTime;
                    if (dt > 0) {
                        const speed = distance / dt * 1000;
                        if (speed > 50) {
                            sliceFruitForPlayer(player, handX, handY);
                        }
                    }
                } else {
                    player.rightBladeTrail.push(new BladePoint(handX, handY));
                }

                player.lastRightHandPosition = { x: handX, y: handY };
                player.lastRightHandTime = now;
            } else {
                player.lastRightHandPosition = null;
            }

            if (player.currentLeftHandPosition) {
                const handX = player.currentLeftHandPosition.x;
                const handY = player.currentLeftHandPosition.y;

                if (player.lastLeftHandPosition) {
                    const dx = handX - player.lastLeftHandPosition.x;
                    const dy = handY - player.lastLeftHandPosition.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > 10) {
                        player.leftBladeTrail.push(new BladePoint(handX, handY));
                    }

                    const dt = now - player.lastLeftHandTime;
                    if (dt > 0) {
                        const speed = distance / dt * 1000;
                        if (speed > 50) {
                            sliceFruitForPlayer(player, handX, handY);
                        }
                    }
                } else {
                    player.leftBladeTrail.push(new BladePoint(handX, handY));
                }

                player.lastLeftHandPosition = { x: handX, y: handY };
                player.lastLeftHandTime = now;
            } else {
                player.lastLeftHandPosition = null;
            }
        }
        
         
 
         
        
        // 更新玩家积分
        function updatePlayerScore(player, points) {
            // 更新积分
            player.score += points;
            // 确保积分不会小于0
            if (player.score < 0) {
                player.score = 0;
            }
            
            // 更新积分显示
            const scoreDisplay = document.getElementById(`score-display-${player.id}`);
            if (scoreDisplay) {
                scoreDisplay.textContent = `积分: ${player.score}`;
                // 添加积分变动动画
                scoreDisplay.classList.add('score-change');
                setTimeout(() => {
                    scoreDisplay.classList.remove('score-change');
                }, 500);
            }
        }
        
        // 显示弹幕
        function showMessage(player, message) {
            const characterRect = player.character.getBoundingClientRect();
            const gameAreaRect = player.gameArea.getBoundingClientRect();
            
            const messageElement = document.createElement('div');
            messageElement.className = '弹幕';
            messageElement.textContent = message;
            messageElement.style.left = `${characterRect.left - gameAreaRect.left + characterRect.width / 2}px`;
            messageElement.style.top = `${characterRect.top - gameAreaRect.top - 50}px`;
            messageElement.style.transform = 'translateX(-50%)';
            
            player.gameArea.appendChild(messageElement);
            
            setTimeout(() => {
                if (messageElement.parentNode) {
                    messageElement.parentNode.removeChild(messageElement);
                }
            }, 2000);
        }
        
        function drawBladeTrail(player, ctx) {
            const now = Date.now();
            
            // 过滤右手轨迹
            if (player.rightBladeTrail) {
                player.rightBladeTrail = player.rightBladeTrail.filter(p => now - p.time < 200);
            }
            // 过滤左手轨迹
            if (player.leftBladeTrail) {
                player.leftBladeTrail = player.leftBladeTrail.filter(p => now - p.time < 200);
            }
            
            const rightColor = '#ffff00'; // 右手黄色
            const leftColor = '#00ffff';  // 左手青色
            
            // 绘制右手轨迹
            if (player.rightBladeTrail && player.rightBladeTrail.length >= 2) {
                for (let i = 0; i < player.rightBladeTrail.length - 1; i++) {
                    const p1 = player.rightBladeTrail[i];
                    const p2 = player.rightBladeTrail[i + 1];
                    drawLightningBolt(ctx, p1.x, p1.y, p2.x, p2.y, rightColor);
                }
                
                const first = player.rightBladeTrail[0];
                const last = player.rightBladeTrail[player.rightBladeTrail.length - 1];
                drawLightningBolt(ctx, first.x, first.y, last.x, last.y, rightColor);
            }
            
            // 绘制左手轨迹
            if (player.leftBladeTrail && player.leftBladeTrail.length >= 2) {
                for (let i = 0; i < player.leftBladeTrail.length - 1; i++) {
                    const p1 = player.leftBladeTrail[i];
                    const p2 = player.leftBladeTrail[i + 1];
                    drawLightningBolt(ctx, p1.x, p1.y, p2.x, p2.y, leftColor);
                }
                
                const first = player.leftBladeTrail[0];
                const last = player.leftBladeTrail[player.leftBladeTrail.length - 1];
                drawLightningBolt(ctx, first.x, first.y, last.x, last.y, leftColor);
            }
        }

        function drawLightningBolt(ctx, x1, y1, x2, y2, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 30;
            
            const distance = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
            const segments = Math.max(4, Math.min(8, Math.floor(distance / 20)));
            const maxOffset = Math.min(10, distance * 0.1);
            
            const dx = (x2 - x1) / segments;
            const dy = (y2 - y1) / segments;
            
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            
            for (let i = 1; i < segments; i++) {
                const offsetX = (Math.random() - 0.5) * maxOffset;
                const offsetY = (Math.random() - 0.5) * maxOffset;
                ctx.lineTo(x1 + dx * i + offsetX, y1 + dy * i + offsetY);
            }
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            ctx.shadowBlur = 50;
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            
            ctx.restore();
        }

        // 初始化游戏
        initGame();
    </script>
