    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff;
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        /* 使用dvh单位确保在移动端浏览器工具栏显示时也能完整显示 */
        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: portrait) {
            .game-container {
                min-height: 400px;
            }
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            overflow: hidden;
        }
        
        /* 使用dvh单位确保在移动端浏览器工具栏显示时也能完整显示 */
        @supports (height: 100dvh) {
            .game-container {
                height: 100dvh;
            }
        }
        
        .game-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(16px, 3vw, 24px);
            font-weight: bold;
            color: #333;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            z-index: 20;
            margin: 0;
            white-space: nowrap;
        }
        
        .game-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
        }

        .character {
            position: absolute;
            width: 10%;
            height: 20%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            z-index: 10;
            bottom: 10%;
            left: 45%;
        }

            background-position: center;
            z-index: 5;

            font-weight: bold;
            color: #ff4500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
            animation: float-up 2s ease-out forwards;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px);
            }
        }

        .score-display {
            position: absolute;
            top: 50px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: red;
            white-space: nowrap;
            text-align: center;
            font-family: 'Microsoft YaHei', sans-serif;
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 5px;
            z-index: 20;
        }

        .start-button {
            position: absolute;
            top: 50px;
            left: 20px;
            height: 36px;
            padding: 0 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            line-height: 36px;
        }

        .camera-container {
            position: absolute;
            top: 100px;
            right: 20px;
            width: 160px;
            height: 120px;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            z-index: 20;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .action-display {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
        }

        .start-button:hover {
            background: #45a049;
        }

        /* 全屏按钮样式 */
        .fullscreen-button {
            position: absolute;
            top: 50px;
            left: 200px;
            height: 36px;
            padding: 0 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 9999;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            line-height: 36px;
        }

        .fullscreen-button:hover {
            background: #1976D2;
        }

        /* 确保在所有屏幕尺寸上都能正常显示 */
        @media (max-width: 1920px) {
            .start-button {
                font-size: 16px;
                padding: 0 16px;
            }
        }

        @media (max-width: 768px) {
            .start-button {
                font-size: 14px;
                padding: 0 12px;
            }
            
            .fullscreen-button {
                font-size: 14px;
                padding: 0 12px;
                left: 15%;
            }
            
            .game-title {
                font-size: 4vw;
            }
            
            .action-display {
                font-size: 14px;
                padding: 6px 12px;
            }
            
            .camera-container {
                width: 20vw;
                height: 15vw;
            }
            
            .character {
                width: 15%;
                height: 25%;
            }
            
            .弹幕 {
                font-size: 3vw;
            }
        }

        @media (max-width: 480px) {
            .start-button {
                font-size: 12px;
                padding: 0 10px;
                height: 36px;
                line-height: 36px;
            }
            
            .fullscreen-button {
                font-size: 12px;
                padding: 0 10px;
                height: 36px;
                line-height: 36px;
                left: 18%;
            }
            
            .game-title {
                font-size: 5vw;
                top: 3%;
            }
            
            .action-display {
                font-size: 12px;
                padding: 4px 10px;
                top: 3%;
            }
            
            .camera-container {
                width: 25vw;
                height: 18.75vw;
                top: 3%;
            }
            
            .character {
                width: 20%;
                height: 30%;
            }

            .弹幕 {
                font-size: 4vw;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">奔跑捡宝物</h1>
        
        <div class="camera-container">
            <video id="camera" autoplay playsinline></video>
        </div>
        
        <div id="action-display" class="action-display">等待识别...</div>
        
        <div class="score-display" id="score-display">积分: 0</div>
        
        <!-- 退出全屏按钮 -->
        <button id="fullscreen-button" class="fullscreen-button">退出全屏</button>
        
        <!-- 开始按钮 -->
        <button id="start-button" class="start-button">开始游戏</button>
        
        <div class="game-area" id="game-area">
            <div class="character" id="character">
                <img id="expression-image" src="" alt="表情" style="width: 100%; height: 100%; object-fit: contain; background-color: transparent;">
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        let gameState = {
            running: false,
            score: 0,
            character: {
                x: 45,
                y: 10,
                speed: 5
            },
            objects: [],
            animationId: null
        };

        // 动作类型
        const ACTION_TYPE = {
            STANDING: '站立',
            RIGHT_HAND_RAISED: '举起右手',
            LEFT_HAND_RAISED: '举起左手',
            BOTH_HANDS_RAISED: '举起双手',
            HANDS_OPEN: '张开双手',
            JUMPING: '跳起来',
            HANDS_ON_HEAD: '双手抱头',
            RIGHT_HAND_EXTENDED: '伸开右手',
            LEFT_HAND_EXTENDED: '伸开左手',
            INCOMPLETE: '未检测到完整姿态'
        };

        // 姿态关键点索引常量
        const LANDMARK_INDEX = {
            NOSE: 0,              // 鼻子
            LEFT_EYE_INNER: 1,    // 左眼内角
            LEFT_EYE: 2,          // 左眼
            LEFT_EYE_OUTER: 3,    // 左眼外角
            RIGHT_EYE_INNER: 4,   // 右眼内角
            RIGHT_EYE: 5,         // 右眼
            RIGHT_EYE_OUTER: 6,   // 右眼外角
            LEFT_EAR: 7,          // 左耳
            RIGHT_EAR: 8,         // 右耳
            MOUTH_LEFT: 9,        // 嘴左角
            MOUTH_RIGHT: 10,      // 嘴右角
            LEFT_SHOULDER: 11,    // 左肩
            RIGHT_SHOULDER: 12,   // 右肩
            LEFT_ELBOW: 13,       // 左肘
            RIGHT_ELBOW: 14,      // 右肘
            LEFT_WRIST: 15,       // 左手腕
            RIGHT_WRIST: 16,      // 右手腕
            LEFT_PINKY: 17,       // 左小指
            RIGHT_PINKY: 18,      // 右小指
            LEFT_INDEX: 19,       // 左食指
            RIGHT_INDEX: 20,      // 右食指
            LEFT_THUMB: 21,       // 左拇指
            RIGHT_THUMB: 22,      // 右拇指
            LEFT_HIP: 23,         // 左髋
            RIGHT_HIP: 24,        // 右髋
            LEFT_KNEE: 25,        // 左膝
            RIGHT_KNEE: 26,       // 右膝
            LEFT_ANKLE: 27,       // 左踝
            RIGHT_ANKLE: 28,      // 右踝
            LEFT_HEEL: 29,        // 左脚后跟
            RIGHT_HEEL: 30,       // 右脚后跟
            LEFT_FOOT_INDEX: 31,  // 左脚趾
            RIGHT_FOOT_INDEX: 32   // 右脚趾
        };

        // 检测姿态关键点是否完整
        function isValidLandmarks(landmarks, requiredIndices = [0, 11, 12, 15, 16, 23, 24]) {
            if (!landmarks || !Array.isArray(landmarks)) {
                return false;
            }
            return requiredIndices.every(idx => landmarks[idx]);
        }

        // 计算两点之间的欧几里得距离
        function calculateDistance(point1, point2) {
            return Math.sqrt(Math.pow(point1.x - point2.x, 2) + Math.pow(point1.y - point2.y, 2));
        }

        // 检测是否张开双手
        function detectHandsOpen(landmarks, shoulderWidth) {
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];

            const isArmsHorizontal = Math.abs(leftWrist.y - leftShoulder.y) < shoulderWidth * 0.9 &&
                                    Math.abs(rightWrist.y - rightShoulder.y) < shoulderWidth * 0.9;
            return isArmsHorizontal;
        }

        // 检测是否双手抱头
        function detectHandsOnHead(landmarks, handsOnHeadThreshold) {
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];
            const nose = landmarks[LANDMARK_INDEX.NOSE];

            const leftWristToNose = calculateDistance(leftWrist, nose);
            const rightWristToNose = calculateDistance(rightWrist, nose);
            return leftWristToNose < handsOnHeadThreshold &&
                   rightWristToNose < handsOnHeadThreshold;
        }

        // 检测是否举起双手
        function detectBothHandsRaised(landmarks, armRaisedThreshold) {
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];

            const leftArmRaised = leftShoulder.y - leftWrist.y > armRaisedThreshold;
            const rightArmRaised = rightShoulder.y - rightWrist.y > armRaisedThreshold;
            return leftArmRaised && rightArmRaised;
        }

        // 检测是否举起右手
        function detectRightHandRaised(landmarks, armRaisedThreshold) {
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];

            const leftArmRaised = leftShoulder.y - leftWrist.y > armRaisedThreshold;
            const rightArmRaised = rightShoulder.y - rightWrist.y > armRaisedThreshold;
            return rightArmRaised && !leftArmRaised;
        }

        // 检测是否举起左手
        function detectLeftHandRaised(landmarks, armRaisedThreshold) {
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];

            const leftArmRaised = leftShoulder.y - leftWrist.y > armRaisedThreshold;
            const rightArmRaised = rightShoulder.y - rightWrist.y > armRaisedThreshold;
            return leftArmRaised && !rightArmRaised;
        }

        // 检测是否伸开右手
        function detectRightHandExtended(landmarks, shoulderWidth, armRaisedThreshold) {
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];

            const rightArmRaised = rightShoulder.y - rightWrist.y > armRaisedThreshold;
            const leftArmRaised = leftShoulder.y - leftWrist.y > armRaisedThreshold;

            return Math.abs(rightWrist.y - rightShoulder.y) < shoulderWidth * 0.4 &&
                   Math.abs(rightWrist.x - rightShoulder.x) > shoulderWidth * 0.5 &&
                   !rightArmRaised &&
                   !leftArmRaised;
        }

        // 检测是否伸开左手
        function detectLeftHandExtended(landmarks, shoulderWidth, armRaisedThreshold) {
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const leftWrist = landmarks[LANDMARK_INDEX.LEFT_WRIST];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const rightWrist = landmarks[LANDMARK_INDEX.RIGHT_WRIST];

            const leftArmRaised = leftShoulder.y - leftWrist.y > armRaisedThreshold;
            const rightArmRaised = rightShoulder.y - rightWrist.y > armRaisedThreshold;

            return Math.abs(leftWrist.y - leftShoulder.y) < shoulderWidth * 0.4 &&
                   Math.abs(leftWrist.x - leftShoulder.x) > shoulderWidth * 0.5 &&
                   !leftArmRaised &&
                   !rightArmRaised;
        }

        // 检测是否跳跃
        function detectJumping(landmarks, config) {
            const nose = landmarks[LANDMARK_INDEX.NOSE];
            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const leftHip = landmarks[LANDMARK_INDEX.LEFT_HIP];
            const rightHip = landmarks[LANDMARK_INDEX.RIGHT_HIP];

            if (config.useUpperBodyJumpDetection) {
                const upperBodyY = (nose.y + leftShoulder.y + rightShoulder.y) / 3;
                return upperBodyY < config.jumpUpperThreshold;
            } else {
                const hipY = (leftHip.y + rightHip.y) / 2;
                return hipY < config.jumpLowerThreshold;
            }
        }

        // 动作识别入口函数
        function recognizeAction(landmarks, options = {}) {
            const defaultOptions = {
                useUpperBodyJumpDetection: true,
                armRaisedThresholdRatio: 0.3,
                jumpUpperThreshold: 0.25,
                jumpLowerThreshold: 0.3,
                handsOnHeadThreshold: 0.3
            };

            const config = { ...defaultOptions, ...options };

            if (!isValidLandmarks(landmarks)) {
                return ACTION_TYPE.INCOMPLETE;
            }

            const leftShoulder = landmarks[LANDMARK_INDEX.LEFT_SHOULDER];
            const rightShoulder = landmarks[LANDMARK_INDEX.RIGHT_SHOULDER];
            const shoulderWidth = Math.abs(leftShoulder.x - rightShoulder.x);
            const armRaisedThreshold = Math.max(0.1, shoulderWidth * config.armRaisedThresholdRatio);

            // 按优先级顺序检测动作
            // 1. 张开双手 - 双臂水平展开
            if (detectHandsOpen(landmarks, shoulderWidth)) {
                return ACTION_TYPE.HANDS_OPEN;
            }
            // // 2. 双手抱头 - 双手靠近头部
            // else if (detectHandsOnHead(landmarks, config.handsOnHeadThreshold)) {
            //     return ACTION_TYPE.HANDS_ON_HEAD;
            // }
            // 3. 举起双手 - 双手同时上举
            else if (detectBothHandsRaised(landmarks, armRaisedThreshold)) {
                return ACTION_TYPE.BOTH_HANDS_RAISED;
            }
            // 4. 举起右手 - 仅右手上举
            else if (detectRightHandRaised(landmarks, armRaisedThreshold)) {
                return ACTION_TYPE.RIGHT_HAND_RAISED;
            }
            // 5. 举起左手 - 仅左手上举
            else if (detectLeftHandRaised(landmarks, armRaisedThreshold)) {
                return ACTION_TYPE.LEFT_HAND_RAISED;
            }
            // 6. 跳起来 - 身体向上跃起
            else if (detectJumping(landmarks, config)) {
                return ACTION_TYPE.JUMPING;
            }
            // 7. 站立 - 常态站立
            else {
                return ACTION_TYPE.STANDING;
            }
        }

        // 游戏初始化
        function initGame() {
            const startButton = document.getElementById('start-button');
            startButton.addEventListener('click', startGame);

            // 初始化摄像头
            initCamera();
        }

        // 初始化摄像头
        function initCamera() {
            const video = document.getElementById('camera');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        video.srcObject = stream;
                    })
                    .catch(err => {
                        console.error('Error accessing camera:', err);
                    });
            }

            // 初始化 MediaPipe Pose
            const pose = new Pose({
                locateFile: (file) => `mediapipe/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                smoothSegmentation: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            // 开始检测
            const camera = new Camera(video, {
                onFrame: async () => {
                    await pose.send({ image: video });
                },
                width: 160,
                height: 120
            });

            camera.start();
        }

        // 处理姿态检测结果
        function onPoseResults(results) {
            if (!results.poseLandmarks) {
                document.getElementById('action-display').textContent = '未检测到完整姿态';
                return;
            }

            const action = recognizeAction(results.poseLandmarks);
            document.getElementById('action-display').textContent = `当前动作: ${action}`;

            // 根据动作控制角色移动
            if (gameState.running) {
                if (action === ACTION_TYPE.LEFT_HAND_EXTENDED) {
                    // 向左移动
                    gameState.character.x = Math.max(0, gameState.character.x - gameState.character.speed);
                } else if (action === ACTION_TYPE.RIGHT_HAND_EXTENDED) {
                    // 向右移动
                    gameState.character.x = Math.min(90, gameState.character.x + gameState.character.speed);
                }

                // 更新角色位置
                updateCharacterPosition();
            }
        }

        // 更新角色位置
        function updateCharacterPosition() {
            const character = document.getElementById('character');
            character.style.left = `${gameState.character.x}%`;
        }

        // 开始游戏
        function startGame() {
            if (gameState.running) return;

            // 重置游戏状态
            gameState.running = true;
            gameState.score = 0;
            gameState.objects = [];
            document.getElementById('score-display').textContent = `积分: ${gameState.score}`;

            // 开始游戏循环
            gameLoop();
        }

        // 游戏循环
        function gameLoop() {
            if (!gameState.running) return;

            // 生成宝物和陷阱
            if (Math.random() < 0.05) {
                generateObject();
            }

            // 更新对象位置
            updateObjects();

            // 检测碰撞
            checkCollisions();

            // 继续游戏循环
            gameState.animationId = requestAnimationFrame(gameLoop);
        }

        // 生成宝物或陷阱
        function generateObject() {
            const gameArea = document.getElementById('game-area');
            const object = document.createElement('div');
            object.className = 'object';

            // 随机生成宝物或陷阱
            if (Math.random() < 0.7) {
                object.classList.add('gold');
                object.dataset.type = 'gold';
            } else {
                object.classList.add('trap');
                object.dataset.type = 'trap';
            }

            // 随机位置
            const x = Math.random() * 90;
            object.style.left = `${x}%`;
            object.style.top = '-10%';

            gameArea.appendChild(object);
            gameState.objects.push(object);
        }

        // 更新对象位置
        function updateObjects() {
            const gameArea = document.getElementById('game-area');
            gameState.objects = gameState.objects.filter(object => {
                const currentTop = parseFloat(object.style.top) || 0;
                object.style.top = `${currentTop + 2}%`;

                // 移除超出屏幕的对象
                if (currentTop > 100) {
                    gameArea.removeChild(object);
                    return false;
                }

                return true;
            });
        }

        // 检测碰撞
        function checkCollisions() {
            const character = document.getElementById('character');
            const characterRect = character.getBoundingClientRect();

            gameState.objects.forEach(object => {
                const objectRect = object.getBoundingClientRect();

                // 检测碰撞
                if (isColliding(characterRect, objectRect)) {
                    if (object.dataset.type === 'gold') {
                        // 捡到宝物，加分
                        gameState.score += 2;
                        showMessage('+2分');
                    } else if (object.dataset.type === 'trap') {
                        // 遇到陷阱，扣分
                        gameState.score -= 2;
                        showMessage('-2分');
                    }

                    // 移除被碰撞的对象
                    const gameArea = document.getElementById('game-area');
                    gameArea.removeChild(object);
                    gameState.objects = gameState.objects.filter(obj => obj !== object);

                    // 更新分数显示
                    document.getElementById('score-display').textContent = `积分: ${gameState.score}`;
                }
            });
        }

        // 检测两个矩形是否碰撞
        function isColliding(rect1, rect2) {
            return rect1.left < rect2.right &&
                   rect1.right > rect2.left &&
                   rect1.top < rect2.bottom &&
                   rect1.bottom > rect2.top;
        }

        // 显示消息
        function showMessage(text) {
            const gameArea = document.getElementById('game-area');
            const message = document.createElement('div');
            message.className = '弹幕';
            message.textContent = text;
            message.style.left = `${gameState.character.x + 5}%`;
            message.style.bottom = '20%';

            gameArea.appendChild(message);

            // 2秒后移除消息
            setTimeout(() => {
                gameArea.removeChild(message);
            }, 2000);
        }

        // 初始化游戏
        window.addEventListener('load', initGame);
    </script>
</body>
